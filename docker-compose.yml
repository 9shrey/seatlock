# docker compose up --build, then open http://localhost:8080
# Add demo shows: docker compose exec app node dist/src/seed.js
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
      POSTGRES_DB: seatlock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock"]
      interval: 2s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgres://seatlock:seatlock@db:5432/seatlock
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me}
    ports:
      - "8080:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
